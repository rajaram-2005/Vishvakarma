# Aetherion — full local stack (hybrid mode).
# The web app also runs fully standalone in local mode (no containers needed).
name: aetherion

services:
  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      Aetherion_API_URL: http://api:8000
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      Aetherion_ENV: production
      Aetherion_PRIVACY_MODE: ${Aetherion_PRIVACY_MODE:-hybrid}
      Aetherion_SYNC_SCOPE: ${Aetherion_SYNC_SCOPE:-none}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OTLP_ENDPOINT: http://otel-collector:4318
      Aetherion_CORS_ORIGINS: http://localhost:3000
    volumes:
      - aetherion-data:/data
    depends_on:
      - postgres
      - redis
      - qdrant

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aetherion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sutra-local}
      POSTGRES_DB: aetherion
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.1
    command: ["--config=/etc/otel/collector.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otel/collector.yaml:ro
    ports:
      - "4317:4317"  # OTLP/gRPC
      - "4318:4318"  # OTLP/HTTP

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-sutra-local}
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  aetherion-data:
  pgdata:
  qdrant-data:
  grafana-data:
