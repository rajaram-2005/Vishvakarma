apiVersion: apps/v1
kind: Deployment
metadata:
  name: aetherion-web
  namespace: aetherion
  labels:
    app.kubernetes.io/name: aetherion-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aetherion-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aetherion-web
    spec:
      containers:
        - name: web
          image: aetherion/web:0.1.0
          ports:
            - containerPort: 3000
          env:
            - name: Aetherion_API_URL
              value: http://sutra-api:8000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aetherion-web
  namespace: aetherion
spec:
  selector:
    app.kubernetes.io/name: aetherion-web
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aetherion
  namespace: aetherion
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: aetherion.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aetherion-web
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aetherion-api
                port:
                  number: 8000
