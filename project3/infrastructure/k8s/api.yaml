apiVersion: apps/v1
kind: Deployment
metadata:
  name: sutra-api
  namespace: sutra
  labels:
    app.kubernetes.io/name: sutra-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sutra-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sutra-api
    spec:
      containers:
        - name: api
          image: sutra/api:0.1.0
          ports:
            - containerPort: 8000
          env:
            - name: SUTRA_ENV
              value: production
            - name: SUTRA_PRIVACY_MODE
              valueFrom:
                configMapKeyRef:
                  name: sutra-config
                  key: privacyMode
            - name: OLLAMA_URL
              valueFrom:
                configMapKeyRef:
                  name: sutra-config
                  key: ollamaUrl
            - name: OPENAI_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: sutra-secrets
                  key: openaiBaseUrl
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sutra-secrets
                  key: openaiApiKey
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sutra-api
  namespace: sutra
spec:
  selector:
    app.kubernetes.io/name: sutra-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sutra-config
  namespace: sutra
data:
  privacyMode: local
  ollamaUrl: http://localhost:11434
