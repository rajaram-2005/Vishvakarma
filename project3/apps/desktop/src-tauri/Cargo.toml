[package]
name = "sutra-desktop"
version = "0.1.0"
description = "SUTRA desktop shell (Tauri v2)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "sutra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
